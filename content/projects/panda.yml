slug: panda
title: Panda
client: Bismit Panda (Me)
role: Developer
year: 2023
description: >
  Toy interpreter for the Panda programming language with both an AST tree-walker evaluator
  and a compiler + VM architecture, inspired by the Monkey language in Go.
challenge: >
  Designing a flexible AST and VM in Rust that can support variable mutability, complex
  operators, and custom data types without sacrificing performance.
solution: >
  Built an AST-based interpreter and a separate compiler + VM pipeline in Rust, leveraging
  enums for node types and a bytecode VM to execute compiled instructions efficiently.
