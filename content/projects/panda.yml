title: Panda
client: Bismit Panda (Me)
role: Developer
year: 2023
description: >
  Toy interpreter for the Panda programming language with both an AST tree-walker evaluator
  and a compiler + VM architecture, inspired by the Monkey language in Go.
challenge: >
  Adding mutable variables, more operators, and custom data types to the Monkey design without
  slowing the VM down.
solution: >
  Wrote a tree-walking interpreter and, separately, a bytecode compiler and VM. AST node types
  are Rust enums.
