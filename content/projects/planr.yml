slug: planr
title: Planr
client: Bismit Panda (Me)
role: Full-stack Developer
year: 2025
description: >
  Multi-tenant project management platform with AI agents that plan projects, answer questions
  over a project's documents, and review GitHub pull requests.
challenge: >
  Project tools hold tasks, docs, and meeting notes, but the code lives on GitHub and the
  conversation lives in Slack or Discord. Planr ties them together, so a pull request can turn
  into review comments and tasks, and activity reaches every place a team watches.
solution: >
  A Bun and Turborepo monorepo. The Next.js app serves the dashboard and a tRPC API, with Better
  Auth for sign-in and OpenFGA for permissions. A separate Hono service runs Mastra agents and
  workflows for project chat, document editing, project setup, and code review, using Tree-sitter
  to analyse code and Qdrant for retrieval. Services talk over Kafka: a GitHub App turns opened
  PRs into review comments, Slack and Discord bots post activity, and a webhook dispatcher sends
  signed deliveries from a Redis queue with retries. Analytics go to ClickHouse.
technologies:
  - Bun
  - TypeScript
  - Next.js
  - tRPC
  - Hono
  - Mastra
  - PostgreSQL
  - Prisma
  - Qdrant
  - Kafka
  - Redis
  - ClickHouse
  - MinIO
  - Better Auth
  - OpenFGA
