slug: athena-lms
title: Athena LMS
client: AstraQ Cyber Defence
role: Owner — architecture, labs infrastructure, and product
year: 2025
description: >
  Learning management platform for cybersecurity training with course authoring, quizzes,
  progress tracking, and organization-scoped workspaces.
challenge: >
  Cybersecurity training needs structured course delivery, assessments, and tenant isolation
  without bolting together generic LMS tools that do not fit hands-on security education.
solution: >
  Built Athena LMS end to end as a multi-tenant Next.js platform where hands-on exercises run inside
  the course player: static and per-learner challenges, an in-browser shell, and live container
  labs on ECS Fargate exposed through Cloudflare Tunnel, all graded against ground truth. A BullMQ
  worker generates courses with AI, Lambda builds per-learner assets, and billing runs through
  Dodo Payments.
technologies:
  - Next.js
  - React
  - TypeScript
  - Better Auth
  - Drizzle ORM
  - PostgreSQL
  - TipTap
  - Tailwind CSS
  - AI SDK
