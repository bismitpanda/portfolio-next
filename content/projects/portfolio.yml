role: Developer
year: 2025
description: >
  This site: portfolio, blog, and code snippets, built with Next.js and MDX.
challenge: >
  One site for projects, posts, and snippets that stays fast and that I can update by editing
  YAML and MDX files.
solution: >
  Built on the Next.js App Router. Content lives in YAML and MDX and loads through Content
  Collections, with Shiki for code highlighting and a set of MDX components for posts. Project
  covers are generated at build time, and the resume PDF is rendered from the same data.
technologies:
  - Next.js
  - React
  - TypeScript
  - Tailwind CSS
  - MDX
  - Content Collections
