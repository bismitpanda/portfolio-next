slug: metis-mail
title: Metis Mail
client: AstraQ Cyber Defence
role: Lead engineer (mailbox, AI features, and typed API layer)
year: 2025
description: >
  AI email client for Gmail, Outlook, and Zoho with full mailbox operations,
  workspace sharing, and streaming inbox agents.
challenge: >
  Teams split across Gmail, Outlook, and Zoho want one client for all of it, shared mailboxes
  included. Any AI added on top has to leave users in control of email that is often sensitive.
solution: >
  Built Metis Mail on Next.js 16 with Better Auth, Drizzle on Neon, and oRPC for end-to-end
  typed APIs. Shipped folder views, threading, compose with TipTap, rules, snooze, scheduled
  send, and streaming AI agents for inbox triage and phishing analysis.
technologies:
  - Next.js
  - React
  - TypeScript
  - Better Auth
  - Drizzle ORM
  - oRPC
  - OpenRouter
  - TipTap
  - Tailwind CSS
liveUrl: https://trymetis.email
cover:
