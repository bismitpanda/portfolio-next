projectType: product
isFeatured: true
isVisible: true
status: beta
ownership: Lead engineer under AstraQ; built most of the codebase
highlights:
  - Implemented multi-provider mailbox OAuth and shared workspace mailboxes
  - Built oRPC router covering mail, labels, rules, and AI helpers with Zod schemas
  - Shipped streaming inbox agent, smart replies, and phishing analysis flows
outcomes:
  - Public beta at trymetis.email with Gmail, Outlook, and Zoho connectivity
  - Production auth with required 2FA and mailbox OAuth integrations
