slug: metis-mail
title: Metis Mail
client: AstraQ Cyber Defence
role: Full-stack engineer — mailbox UX, AI features, and typed API layer
year: 2025
description: >
  AI-native email client for Gmail, Outlook, and Zoho with full mailbox operations,
  workspace sharing, and streaming inbox agents.
challenge: >
  Power users need a modern mail client that unifies multiple providers, supports team
  mailboxes, and layers AI assistance without sacrificing control over sensitive email data.
solution: >
  Built Metis Mail on Next.js 16 with Better Auth, Drizzle on Neon, and oRPC for end-to-end
  typed APIs. Shipped folder views, threading, compose with TipTap, rules, snooze, scheduled
  send, and streaming AI agents for inbox triage and phishing analysis.
technologies:
  - Next.js
  - React
  - TypeScript
  - Better Auth
  - Drizzle ORM
  - oRPC
  - OpenRouter
  - TipTap
  - Tailwind CSS
