slug: phoebe
title: Phoebe
client: AstraQ Cyber Defence
role: Owner — architecture, backend, sync, infrastructure, and product
year: 2025
description: >
  Enterprise RAG platform that connects company data sources, indexes them with hybrid search, and
  answers questions grounded in cited sources.
challenge: >
  Teams need to ingest documents from multiple connectors, run generation workflows, and
  manage organization-level access without stitching together separate auth, billing, and
  sync systems.
solution: >
  Built Phoebe end to end. A Rust (Axum) API server runs hybrid dense and BM25 search on a shared
  Milvus cluster, with a collection per connector and per-tenant access control. Syncs are
  dispatched as Kubernetes Jobs running a Python worker. Postgres is split across three
  least-privilege roles, and every service pushes OpenTelemetry traces, metrics, and logs to
  OpenObserve. The TanStack Start frontend handles auth, connectors, and organization billing.
technologies:
  - Rust
  - Axum
  - Python
  - TypeScript
  - TanStack Start
  - Milvus
  - PostgreSQL
  - Kubernetes
  - Envoy Gateway
  - OpenTelemetry
resumeSummary: >
  Enterprise RAG platform (Rust, Milvus hybrid search, Kubernetes sync jobs) built end to end
