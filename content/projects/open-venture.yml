slug: open-venture
title: Open Venture
client: Greencard Inc.
role: Lead Developer
year: 2025
description: >
  Marketing site for OpenVenture's U.S. concierge services: visa help, housing, tax filing,
  incubator support, and EB-5 programs. Section content and headline numbers come from a CMS.
challenge: >
  Five service lines had to share one site and one design, and the team needed to change
  numbers, testimonials, and partner logos without waiting on a deploy.
solution: >
  Built the site in Next.js with Tailwind CSS and shadcn/ui. Sanity holds the section content,
  the counters, and the client testimonials, which play in a responsive carousel. Newsletter
  signups go to ConvertKit.
technologies:
  - Next.js
  - React
  - Tailwind CSS
  - TypeScript
  - Shadcn/UI
  - Sanity
  - ConvertKit
