slug: athena-ctf
title: Athena CTF Platform
client: AstraQ Cyber Defence
role: Co-Founder & CTO (platform architecture and core engineering)
year: 2024
description: >
  Kubernetes-native capture-the-flag platform that provisions isolated infrastructure per event and
  a private challenge instance per team, with live scoring, anti-cheat, and attack-defense support.
challenge: >
  CTF organizers need isolated, reproducible competition environments on demand, for anything from a
  university practice lab to a national event, without hand-building clusters. Players need every
  challenge instance to stay reachable, private to their team, and stable across expiry and redeploy.
solution: >
  Started as a solo project in 2024 and grew into AstraQ's flagship product. An organizer control
  plane provisions each event through a Go service built on the Helm SDK. Every event gets its own
  player app and database. A Rust gRPC runner launches per-team challenge instances on AWS ECS
  Fargate, which players reach through SNI routing at an Envoy Gateway, one hostname per instance.
  Around it sit a Rust attack-defense engine, a batch anti-cheat job, event data export, SSO, a
  Discord bot, and a cross-platform proxy CLI for TCP challenges.
technologies:
  - Rust
  - Go
  - TypeScript
  - TanStack Start
  - Next.js
  - gRPC
  - Kubernetes
  - Helm
  - Envoy Gateway
  - AWS ECS Fargate
  - PostgreSQL
  - Redis
