slug: athena-ctf
title: Athena CTF Platform
client: AstraQ Cyber Defence
role: Co-Founder & CTO — platform architecture and core engineering
year: 2024
description: >
  Multi-tenant capture-the-flag hosting platform that provisions isolated Kubernetes
  infrastructure per event, with per-player challenge orchestration and live scoreboards.
challenge: >
  CTF operators need to spin up isolated, secure competition environments on demand without
  manual infrastructure work. Players need reliable challenge deployment, flag submission,
  and real-time leaderboards at competition scale.
solution: >
  Built the original solo platform foundation—admin provisioning, deployment workers, and
  challenge orchestration—before the product moved under AstraQ. The current stack spans a
  Next.js admin panel, TanStack Start player app, Go platform provisioner with Helm, Rust
  deployment runner, and Redis-stream-driven workers across per-event Kubernetes namespaces.
technologies:
  - Next.js
  - TanStack Start
  - TypeScript
  - Go
  - Rust
  - Kubernetes
  - Helm
  - PostgreSQL
  - Redis
  - Docker
